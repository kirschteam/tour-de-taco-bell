/* ---------------- state ---------------- */
function freshState() { return { names: DEFAULT_NAMES.slice(), start: null, items: {}, stops: {} }; }

function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
try { tab = sessionStorage.getItem('tdtb-tab') || 'race'; } catch (e) {}
function saveTab() { try { sessionStorage.setItem('tdtb-tab', tab); } catch (e) {} }

/* normalize whatever the DB returns (nulls, arrays with holes) into the full shape */
function normalize(raw) {
  var st = freshState();
  if (!raw || typeof raw !== 'object') return st;
  if (raw.names) for (var i = 0; i < 5; i++) if (raw.names[i]) st.names[i] = String(raw.names[i]);
  if (raw.start) st.start = raw.start;
  var k;
  if (raw.items && typeof raw.items === 'object') for (k in raw.items) if (raw.items[k]) st.items[k] = raw.items[k];
  if (raw.stops && typeof raw.stops === 'object') for (k in raw.stops) if (raw.stops[k]) st.stops[k] = raw.stops[k];
  return st;
}

/* ---------------- sync: Firebase RTDB over REST + SSE ---------------- */
var queue = [];
try { queue = JSON.parse(ls('tdtb-queue') || '[]'); } catch (e) { queue = []; }
var sending = false, esRetry = 0;

function saveQueue() { ls('tdtb-queue', queue.length ? JSON.stringify(queue) : null); }
function saveSolo() { ls('tdtb-state', JSON.stringify(state)); }

function applyOp(st, op) {
  if (op.k === 'item') { if (op.p === null) delete st.items[op.id]; else st.items[op.id] = { p: op.p, t: op.t }; }
  else if (op.k === 'stop') { if (op.s === null) delete st.stops[op.i]; else st.stops[op.i] = { s: op.s, t: op.t }; }
  else if (op.k === 'name') { st.names[op.i] = op.v; }
  else if (op.k === 'start') { if (!st.start) st.start = op.t; }
  else if (op.k === 'reset') { var n = st.names; var f = freshState(); f.names = n; return f; }
  return st;
}

function opRequest(op) {
  var base = DB_URL.replace(/\/$/, '') + DB_PATH;
  if (op.k === 'item') return op.p === null
    ? { m: 'DELETE', u: base + '/items/' + op.id + '.json' }
    : { m: 'PUT', u: base + '/items/' + op.id + '.json', b: { p: op.p, t: op.t } };
  if (op.k === 'stop') return op.s === null
    ? { m: 'DELETE', u: base + '/stops/' + op.i + '.json' }
    : { m: 'PUT', u: base + '/stops/' + op.i + '.json', b: { s: op.s, t: op.t } };
  if (op.k === 'name') return { m: 'PUT', u: base + '/names/' + op.i + '.json', b: op.v };
  if (op.k === 'start') return { m: 'PUT', u: base + '/start.json', b: op.t };
  if (op.k === 'reset') return { m: 'PUT', u: base + '.json', b: { names: op.names } };
  return null;
}

function pump() {
  if (sending || !queue.length || syncMode === 'solo') return;
  sending = true;
  var op = queue[0], req = opRequest(op);
  if (!req) { queue.shift(); saveQueue(); sending = false; pump(); return; }
  fetch(req.u, { method: req.m, body: req.b === undefined ? undefined : JSON.stringify(req.b) })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); })
    .then(function () {
      queue.shift(); saveQueue(); sending = false;
      if (syncMode === 'offline') { syncMode = 'live'; render(); } else setChip();
      pump();
    })
    .catch(function () {
      sending = false;
      if (syncMode !== 'offline') { syncMode = 'offline'; render(); }
      setTimeout(pump, 3000);
    });
}

function dispatch(op) {
  state = applyOp(state, op);
  if (syncMode === 'solo') saveSolo();
  else { if (op.k === 'reset') { op.names = state.names.slice(); queue = []; } queue.push(op); saveQueue(); pump(); }
  render();
}

function setAtPath(path, data) {
  var segs = path.split('/').filter(Boolean);
  if (!segs.length) { state = normalize(data); return; }
  /* rebuild a raw copy, set, renormalize — keeps array/object coercion sane */
  var raw = JSON.parse(JSON.stringify(state));
  var node = raw;
  for (var i = 0; i < segs.length - 1; i++) {
    if (typeof node[segs[i]] !== 'object' || node[segs[i]] === null) node[segs[i]] = {};
    node = node[segs[i]];
  }
  var last = segs[segs.length - 1];
  if (data === null) delete node[last]; else node[last] = data;
  state = normalize(raw);
}

function connectStream() {
  if (!DB_URL) return;
  var es;
  try { es = new EventSource(DB_URL.replace(/\/$/, '') + DB_PATH + '.json'); }
  catch (e) { syncMode = 'offline'; render(); return; }
  es.addEventListener('put', function (ev) {
    var d = JSON.parse(ev.data);
    setAtPath(d.path, d.data);
    esRetry = 0;
    if (syncMode !== 'live') syncMode = 'live';
    render();
  });
  es.addEventListener('patch', function (ev) {
    var d = JSON.parse(ev.data);
    for (var k in d.data) setAtPath(d.path.replace(/\/$/, '') + '/' + k, d.data[k]);
    render();
  });
  es.onerror = function () {
    es.close();
    if (syncMode !== 'offline') { syncMode = 'offline'; render(); }
    esRetry = Math.min(esRetry + 1, 5);
    setTimeout(connectStream, 1000 * Math.pow(2, esRetry));
  };
}

/* ---------------- derived ---------------- */
function itemById(id) { for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i][0] === id) return ITEMS[i]; return null; }
function eatenCount() { var n = 0; for (var k in state.items) n++; return n; }
function stopCounts() {
  var done = 0, skip = 0;
  for (var k in state.stops) { if (state.stops[k].s === 'done') done++; else if (state.stops[k].s === 'skip') skip++; }
  return { done: done, skip: skip, active: STOPS.length - skip };
}
function overallPct() {
  var sc = stopCounts();
  var ip = eatenCount() / ITEMS.length;
  var sp = sc.active ? sc.done / sc.active : 1;
  return Math.round((ip * ITEM_W + sp * STOP_W) * 100);
}
function playerTotals() {
  var t = [];
  for (var p = 0; p < 5; p++) t.push({ items: 0, cal: 0, pro: 0, carb: 0, fat: 0 });
  for (var id in state.items) {
    var it = itemById(id); if (!it) continue;
    var p2 = state.items[id].p; if (p2 == null || !t[p2]) continue;
    t[p2].items++; t[p2].cal += it[4]; t[p2].pro += it[5]; t[p2].carb += it[6]; t[p2].fat += it[7];
  }
  return t;
}
function groupCalTotal() { var s = 0; for (var i = 0; i < ITEMS.length; i++) s += ITEMS[i][4]; return s; }
function nextStopIdx() {
  for (var i = 0; i < STOPS.length; i++) { var st = state.stops[i]; if (!st || (st.s !== 'done' && st.s !== 'skip')) return i; }
  return -1;
}
function fmtClock(ts) {
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
}
function etaInfo() {
  var sc = stopCounts();
  var remaining = sc.active - sc.done;
  if (remaining <= 0 && sc.active > 0) return { label: 'FINISHED', sub: 'Ya Hecho. Live Más.' };
  if (!state.start) {
    var mins = remaining * PRESTART_MIN_PER_STOP;
    return { label: '~' + Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm of racing', sub: 'estimate · ' + PRESTART_MIN_PER_STOP + ' min per stop · starts when you check in' };
  }
  if (!sc.done) return { label: 'warming up', sub: 'ETA locks in after the first stop is done' };
  var pace = (Date.now() - state.start) / sc.done; /* ms per stop, drive included */
  var eta = Date.now() + pace * remaining;
  return { label: fmtClock(eta), sub: 'pace ' + Math.round(pace / 60000) + ' min/stop · ' + remaining + ' stops to go' };
}
function breakfastLeft() {
  var n = 0;
  for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i][1] === 'Breakfast' && !state.items[ITEMS[i][0]]) n++;
  return n;
}
function isRaceMorning() {
  var d = new Date();
  var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return iso <= RACE_DAY && d.getHours() < BK_CUTOFF_H;
}
function mapsUrl(i) { return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent('Taco Bell, ' + STOPS[i][0] + ', ' + STOPS[i][1].replace(/\s*\(.*\)/, '').replace(/·.*/, '')); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

'.num{font-variant-numeric:tabular-nums}',

'.fbtn.on{background:var(--pink);border-color:var(--pink);color:#fff}',

'.search::placeholder{color:var(--muted)}',

'.dot.next{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px #6b4c10}',
'.stoprow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}',

'.stoprow.skip{opacity:.5}',
'.stoprow .info{flex:1;min-width:0}.stoprow .a{font-weight:700;font-size:14px}.stoprow .c{font-size:12px;color:var(--muted)}',
'.stoprow .t{font-size:11px;color:var(--teal)}',
'.stopbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch}',

].join('\n');

var styleEl = document.createElement('style');
styleEl.textContent = CSS;
document.head.appendChild(styleEl);
var root = document.getElementById('root');

/* ---------------- rendering ---------------- */
function chipText() {
  if (syncMode === 'solo') return 'solo · no sync';
  if (syncMode === 'live') return queue.length ? 'saving…' : 'live';
  if (syncMode === 'offline') return 'offline · retrying';
  return 'connecting…';
}
function setChip() {
  var el = document.getElementById('syncchip'); if (!el) return;
  el.className = 'sync ' + syncMode;
  el.textContent = chipText();
}

function render() {
  var pct = overallPct();
  var html = '';
  html += '<header><div class="hdr-row"><div class="wordmark disp">Tour de <em>Taco Bell</em></div>' +
    '<span id="syncchip" class="sync ' + syncMode + '">' + chipText() + '</span></div>' +
    '<div class="hdr-bar"><i style="width:' + pct + '%"></i></div></header>';
  html += '<main>';
  if (syncMode === 'solo') html += '<div class="banner">Solo mode: progress saves to this phone only. Live team sync turns on once the database is wired up.</div>';
  if (tab === 'race') html += renderRace(pct);
  else if (tab === 'menu') html += renderMenu();
  else if (tab === 'route') html += renderRoute();
  else html += renderSquad();
  html += '</main>';
  html += '<nav>' + [
    ['race', '🏁', 'Race'],
    ['menu', '🌮', 'Menu'],
    ['route', '🗺', 'Route'],
    ['squad', '🚴', 'Squad']
  ].map(function (t) {
    return '<button class="tabbtn' + (tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '"><span class="ic">' + t[1] + '</span><span class="lb">' + t[2] + '</span></button>';
  }).join('') + '</nav>';
  root.innerHTML = html;
  wire();
}

function renderRace(pct) {
  var sc = stopCounts(), eaten = eatenCount(), eta = etaInfo();
  var ns = nextStopIdx();
  var totals = playerTotals();
  var calEaten = 0; totals.forEach(function (t) { calEaten += t.cal; });
  var calAll = groupCalTotal();
  var r = 56, circ = 2 * Math.PI * r;
  var h = '<div class="card"><div class="hero">' +
    '<div class="ringwrap"><svg viewBox="0 0 128 128">' +
    '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="#3A1B55" stroke-width="11"/>' +
    '<circle class="ringfg" cx="64" cy="64" r="' + r + '" fill="none" stroke="#FF3D9A" stroke-linecap="round" stroke-width="11" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - pct / 100)) + '"/>' +
    '</svg><div class="ringlabel"><span class="pct disp num">' + pct + '%</span><span class="pctsub">complete</span></div></div>' +
    '<div class="hero-stats">' +
    '<div class="stat"><div class="v disp num">' + (ITEMS.length - eaten) + '</div><div class="k">items left of ' + ITEMS.length + '</div></div>' +
    '<div class="stat"><div class="v disp num">' + (sc.active - sc.done) + '</div><div class="k">stops left of ' + sc.active + (sc.skip ? ' (' + sc.skip + ' skipped)' : '') + '</div></div>' +
    '</div></div></div>';

  if (ns >= 0) {
    var isFinish = ns === STOPS.length - 1;
    h += '<div class="card"><h2>' + (isFinish ? 'Final stage' : 'Next stop') + '</h2><div class="nextstop">' +
      '<div class="stage-badge' + (isFinish ? ' finish' : '') + '"><span class="sn disp num">' + (ns + 1) + '</span><span class="sk">stage</span></div>' +
      '<div><div class="addr">' + esc(STOPS[ns][0]) + '</div><div class="city">' + esc(STOPS[ns][1]) + '</div></div>' +
      '<a class="navbtn" target="_blank" rel="noopener" href="' + mapsUrl(ns) + '">Navigate</a>' +
      '</div></div>';
  } else {
    h += '<div class="card"><h2>Route</h2><div class="disp" style="font-size:22px;color:var(--gold)">Every stage complete 🏆</div></div>';
  }

  h += '<div class="card"><h2>Projected finish</h2>' +
    '<div class="disp num" style="font-size:30px">' + eta.label + '</div>' +
    '<div style="color:var(--muted);font-size:13px;margin-top:2px">' + eta.sub + '</div>' +
    (!state.start ? '<button class="btn primary" id="startbtn" style="margin-top:12px">🚦 Start the race clock</button>' : '') +
    '</div>';

  var bk = breakfastLeft();
  if (bk > 0 && isRaceMorning()) {
    h += '<div class="card"><span class="chip warn">🌅 ' + bk + ' breakfast item' + (bk === 1 ? '' : 's') + ' left — sold until ~11 AM</span></div>';
  }

  h += '<div class="card"><h2>Group intake</h2>' +
    '<div class="kv"><span class="k">Calories eaten</span><span class="num"><b>' + calEaten.toLocaleString() + '</b> / ' + calAll.toLocaleString() + '</span></div>' +
    '<div class="kv"><span class="k">Fair share</span><span class="num">~' + Math.round(ITEMS.length / 5) + ' items · ~' + Math.round(calAll / 5).toLocaleString() + ' cal each</span></div>' +
    '<div class="pbar"><i style="width:' + Math.min(100, Math.round(calEaten / calAll * 100)) + '%;background:linear-gradient(90deg,var(--teal),var(--gold))"></i></div>' +
    '</div>';
  h += '<div class="finish-note">Sunday 8/30 · 30 stages · 111 items · 5 riders · finish: 168th &amp; Maple</div>';
  h += '<div class="resetwrap"><button class="btn danger" id="resetbtn">Reset race data</button></div>';
  return h;
}

function renderMenu() {
  var h = '<input class="search" id="menusearch" type="search" placeholder="Search 111 items…" value="' + esc(menuSearch) + '">';
  h += '<div class="filters">' + [['all', 'All'], ['left', 'Left'], ['eaten', 'Eaten']].map(function (f) {
    return '<button class="fbtn' + (menuFilter === f[0] ? ' on' : '') + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
  }).join('') + '</div>';
  var q = menuSearch.toLowerCase();
  CAT_ORDER.forEach(function (cat) {
    var rows = ITEMS.filter(function (it) { return it[1] === cat; });
    var vis = rows.filter(function (it) {
      var done = !!state.items[it[0]];
      if (menuFilter === 'left' && done) return false;
      if (menuFilter === 'eaten' && !done) return false;
      if (q && it[2].toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!vis.length) return;
    var doneN = rows.filter(function (it) { return !!state.items[it[0]]; }).length;
    h += '<div class="cathdr"><span class="cn disp">' + esc(cat) + '</span><span class="cp num">' + doneN + '/' + rows.length + '</span></div>';
    vis.forEach(function (it) {
      var e = state.items[it[0]];
      var chip = e && e.p != null
        ? '<span class="pchip" style="background:' + JERSEYS[e.p] + '">' + esc((state.names[e.p] || '?').charAt(0)) + '</span>'
        : '<span class="tick"></span>';
      h += '<button class="itemrow' + (e ? ' done' : '') + '" data-item="' + it[0] + '">' + chip +
        '<span class="nm">' + esc(it[2]) + (it[3] ? ' <span class="note">' + esc(it[3]) + '</span>' : '') + '</span>' +
        '<span class="cal num">' + it[4] + (it[8] ? '~' : '') + ' cal</span></button>';
    });
  });
  h += '<div class="finish-note">~ = estimated nutrition (not published by Taco Bell)</div>';
  return h;
}

function renderRoute() {
  var ns = nextStopIdx();
  var h = '<div class="card"><h2>Stage board</h2><div class="strip">';
  for (var i = 0; i < STOPS.length; i++) {
    var st = state.stops[i];
    var cls = st && st.s === 'done' ? ' done' : st && st.s === 'skip' ? ' skip' : (i === ns ? ' next' : '');
    h += '<div class="dot num' + cls + '">' + (i + 1) + '</div>';
  }
  h += '</div></div>';
  for (var j = 0; j < STOPS.length; j++) {
    var s2 = state.stops[j];
    var status = s2 ? s2.s : null;
    var isFinish = j === STOPS.length - 1;
    h += '<div class="stoprow' + (status === 'done' ? ' done' : status === 'skip' ? ' skip' : '') + '">' +
      '<div class="stage-badge' + (isFinish ? ' finish' : '') + '" style="width:44px;height:44px"><span class="sn disp num" style="font-size:16px">' + (j + 1) + '</span><span class="sk">' + (isFinish ? 'finish' : 'stage') + '</span></div>' +
      '<div class="info"><div class="a">' + esc(STOPS[j][0]) + '</div><div class="c">' + esc(STOPS[j][1]) + '</div>' +
      (s2 && s2.t ? '<div class="t num">' + (status === 'done' ? '✓ ' + fmtClock(s2.t) : 'skipped') + '</div>' : '<a class="maplink" target="_blank" rel="noopener" href="' + mapsUrl(j) + '">Open in Maps →</a>') +
      '</div>' +
      '<div class="stopbtns">' +
      '<button class="sbtn' + (status === 'done' ? ' done-on' : '') + '" data-stopdone="' + j + '">' + (status === 'done' ? 'Done ✓' : 'Done') + '</button>' +
      '<button class="sbtn skip-btn" data-stopskip="' + j + '">' + (status === 'skip' ? 'unskip' : 'skip') + '</button>' +
      '</div></div>';
  }
  return h;
}

function renderSquad() {
  var totals = playerTotals();
  var maxCal = 0, leader = -1;
  totals.forEach(function (t, i) { if (t.cal > maxCal) { maxCal = t.cal; leader = i; } });
  var h = '';
  if (me < 0) h += '<div class="banner">Tap “this is me” on your card — it makes logging items one tap.</div>';
  for (var p = 0; p < 5; p++) {
    var t = totals[p];
    h += '<div class="pcard" style="border-left-color:' + JERSEYS[p] + '">' +
      '<div class="prow1"><span class="pchip" style="background:' + JERSEYS[p] + '">' + esc((state.names[p] || '?').charAt(0)) + '</span>' +
      '<span class="pname disp">' + esc(state.names[p]) + '</span>' +
      (leader === p && maxCal > 0 ? '<span class="jersey">💛 yellow jersey</span>' : '') +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      '<button class="mebtn' + (me === p ? ' on' : '') + '" data-me="' + p + '">' + (me === p ? '✓ this is me' : 'this is me') + '</button>' +
      '<button class="mebtn" data-rename="' + p + '">rename</button>' +
      '</div>' +
      '<div class="macros">' +
      '<div><div class="mv disp num">' + t.cal.toLocaleString() + '</div><div class="mk">cal</div></div>' +
      '<div><div class="mv disp num">' + t.pro + 'g</div><div class="mk">protein</div></div>' +
      '<div><div class="mv disp num">' + t.carb + 'g</div><div class="mk">carbs</div></div>' +
      '<div><div class="mv disp num">' + t.fat + 'g</div><div class="mk">fat</div></div>' +
      '</div>' +
      '<div class="pbar"><i style="width:' + (maxCal ? Math.round(t.cal / maxCal * 100) : 0) + '%;background:' + JERSEYS[p] + '"></i></div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:6px" class="num">' + t.items + ' item' + (t.items === 1 ? '' : 's') + ' eaten</div>' +
      '</div>';
  }
  return h;
}

/* ---------------- sheets ---------------- */
function openEatSheet(id) {
  var it = itemById(id); if (!it) return;
  var cur = state.items[id];
  var h = '<div class="overlay" id="overlay"><div class="sheet">' +
    '<h3>' + esc(it[2]) + (it[3] ? ' · ' + esc(it[3]) : '') + '</h3>' +
    '<div class="sub num">' + it[4] + (it[8] ? '~' : '') + ' cal · ' + it[5] + 'g protein · ' + it[6] + 'g carbs · ' + it[7] + 'g fat</div>' +
    '<div class="eatgrid">';
  if (me >= 0 && !cur) h += '<button class="eatbtn big" data-eat="' + me + '" style="background:' + JERSEYS[me] + '">' + esc(state.names[me]) + ' ate it</button>';
  for (var p = 0; p < 5; p++) {
    if (me >= 0 && !cur && p === me) continue;
    h += '<button class="eatbtn" data-eat="' + p + '" style="background:' + JERSEYS[p] + '">' + esc(state.names[p]) + (cur && cur.p === p ? ' ✓' : '') + '</button>';
  }
  h += '</div><div class="row2">' +
    (cur ? '<button class="btn" id="clearitem">Undo — nobody ate it</button>' : '') +
    '<button class="btn" id="closesheet">Cancel</button></div>' +
    '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  var ov = document.getElementById('overlay');
  ov.addEventListener('click', function (ev) {
    if (ev.target === ov || ev.target.id === 'closesheet') { ov.remove(); return; }
    var eat = ev.target.closest('[data-eat]');
    if (eat) { dispatch({ k: 'item', id: id, p: parseInt(eat.getAttribute('data-eat'), 10), t: Date.now() }); ov.remove(); return; }
    if (ev.target.id === 'clearitem') { dispatch({ k: 'item', id: id, p: null, t: Date.now() }); ov.remove(); }
  });
}

function openRenameSheet(p) {
  var h = '<div class="overlay" id="overlay"><div class="sheet">' +
    '<h3>Rename rider</h3><div class="sub">Jersey stays <span style="color:' + JERSEYS[p] + '">●</span></div>' +
    '<input class="namein" id="namein" value="' + esc(state.names[p]) + '" maxlength="14">' +
    '<div class="row2"><button class="btn primary" id="savename">Save</button><button class="btn" id="closesheet">Cancel</button></div>' +
    '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  var ov = document.getElementById('overlay');
  document.getElementById('namein').focus();
  ov.addEventListener('click', function (ev) {
    if (ev.target === ov || ev.target.id === 'closesheet') { ov.remove(); return; }
    if (ev.target.id === 'savename') {
      var v = document.getElementById('namein').value.trim();
      if (v) dispatch({ k: 'name', i: p, v: v });
      ov.remove();
    }
  });
}

function openResetSheet() {
  var h = '<div class="overlay" id="overlay"><div class="sheet">' +
    '<h3>Reset race data?</h3>' +
    '<div class="sub">Wipes all eaten items, stop check-ins, and the race clock' + (syncMode === 'solo' ? ' on this phone' : ' for EVERYONE') + '. Rider names stay. No undo.</div>' +
    '<div class="row2"><button class="btn danger" id="confirmreset">Yes, reset everything</button><button class="btn" id="closesheet">Cancel</button></div>' +
    '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  var ov = document.getElementById('overlay');
  ov.addEventListener('click', function (ev) {
    if (ev.target === ov || ev.target.id === 'closesheet') { ov.remove(); return; }
    if (ev.target.id === 'confirmreset') { dispatch({ k: 'reset' }); ov.remove(); }
  });
}

/* ---------------- events ---------------- */
function wire() {
  root.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { tab = b.getAttribute('data-tab'); saveTab(); render(); window.scrollTo(0, 0); });
  });
  var sb = document.getElementById('startbtn');
  if (sb) sb.addEventListener('click', function () { dispatch({ k: 'start', t: Date.now() }); });
  var rb = document.getElementById('resetbtn');
  if (rb) rb.addEventListener('click', openResetSheet);
  var msearch = document.getElementById('menusearch');
  if (msearch) msearch.addEventListener('input', function () {
    menuSearch = msearch.value;
    var keep = msearch.value;
    render();
    var again = document.getElementById('menusearch');
    if (again) { again.value = keep; again.focus(); try { again.setSelectionRange(keep.length, keep.length); } catch (e) {} }
  });
  root.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () { menuFilter = b.getAttribute('data-filter'); render(); });
  });
  root.querySelectorAll('[data-item]').forEach(function (b) {
    b.addEventListener('click', function () { openEatSheet(b.getAttribute('data-item')); });
  });
  root.querySelectorAll('[data-stopdone]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = parseInt(b.getAttribute('data-stopdone'), 10);
      var cur = state.stops[i];
      if (cur && cur.s === 'done') dispatch({ k: 'stop', i: i, s: null, t: Date.now() });
      else { if (!state.start) dispatch({ k: 'start', t: Date.now() }); dispatch({ k: 'stop', i: i, s: 'done', t: Date.now() }); }
    });
  });
  root.querySelectorAll('[data-stopskip]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = parseInt(b.getAttribute('data-stopskip'), 10);
      var cur = state.stops[i];
      if (cur && cur.s === 'skip') dispatch({ k: 'stop', i: i, s: null, t: Date.now() });
      else dispatch({ k: 'stop', i: i, s: 'skip', t: Date.now() });
    });
  });
  root.querySelectorAll('[data-me]').forEach(function (b) {
    b.addEventListener('click', function () { me = parseInt(b.getAttribute('data-me'), 10); ls('tdtb-player', String(me)); render(); });
  });
  root.querySelectorAll('[data-rename]').forEach(function (b) {
    b.addEventListener('click', function () { openRenameSheet(parseInt(b.getAttribute('data-rename'), 10)); });
  });
}

/* ---------------- boot ---------------- */
if (syncMode === 'solo') {
  try { var saved = ls('tdtb-state'); if (saved) state = normalize(JSON.parse(saved)); } catch (e) {}
} else {
  connectStream();
  pump();
}
render();

/* live ETA refresh */
setInterval(function () { if (tab === 'race' && !document.getElementById('overlay')) render(); }, 60000);
})();
</script>
</body>
</html>
